[package]
name = "harbor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bollard = "0.21.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
sysinfo = "0.39.6"
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
